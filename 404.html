<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        const path = window.location.pathname;
        const base = "/MyProfile/";

        const route = path.startsWith(base)
            ? path.slice(base.length)
            : path;

        window.location.replace(
            base + "?redirect=" + encodeURIComponent(route)
        );
    </script>
</head>
<body>
</body>
</html>
